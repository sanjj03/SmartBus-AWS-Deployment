{% extends 'base.html' %}

{% block content %}

<h2 class="page-title">⏱ ETA Prediction</h2>

<div class="glass-card p-4">

    <form method="POST">

        <div class="row">

            <div class="col-md-4">
                <label>Distance (KM)</label>
                <input type="number" step="0.1" min="0" name="distance" class="form-control" required>
            </div>

            <div class="col-md-4">
                <label>Traffic Level</label>
                <select class="form-control" name="traffic">
                    <option>Low</option>
                    <option>Medium</option>
                    <option>High</option>
                </select>
            </div>

            <div class="col-md-4">
                <label>Weather</label>
                <select class="form-control" name="weather">
                    <option>Clear</option>
                    <option>Rainy</option>
                    <option>Fog</option>
                </select>
            </div>

        </div>

        <br>

        <button class="btn btn-primary" type="submit">Predict ETA</button>

    </form>

</div>

<br>

<div class="glass-card p-4">

    <h4>Prediction Result</h4>
    <hr>

    {% if result is not none %}
    <h1 style="font-size:60px;">{{ result }} Min</h1>
    {% else %}
    <p>Fill the form above to get an ETA estimate.</p>
    {% endif %}

</div>

{% endblock %}
